name: render-public-film

# ENCRYPTED-PUBLIC route — real film sections (Germany). The repo is PUBLIC
# and minutes are unlimited; it contains ONLY AES-256 ciphertext (payload/)
# + unpack.sh. The runner decrypts into work/ with the RENDER_KEY secret,
# builds the section exactly like the proven private workflows (fetch photos,
# plates, stickers, mix, npm ci), then renders stills OR a frame range with
# the Spain rolling-encode method. Output ships as artifacts — never committed.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Section slug (gerhook, gerpart1..gerpart8)"
        required: true
      comp:
        description: "Composition id / file base (GerHook, GerPart1..)"
        required: true
      stills:
        description: "Stills script filename (ger-hook-stills.mjs / ger-partN-stills.mjs)"
        required: true
      mode:
        description: "stills | render1 | render2 | render3"
        required: true
        default: "stills"
      start:
        description: "First frame (render modes)"
        required: false
        default: "0"
      end:
        description: "Last frame (render modes)"
        required: false
        default: "0"

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install --break-system-packages pillow numpy

      - name: Check RENDER_KEY secret is set
        env:
          RENDER_KEY: ${{ secrets.RENDER_KEY }}
        run: |
          if [ -z "$RENDER_KEY" ]; then
            echo "ERROR: RENDER_KEY secret is not set on this repo." >&2
            exit 1
          fi
          echo "RENDER_KEY secret is present (value never printed)."

      - name: Unpack encrypted payload
        env:
          RENDER_KEY: ${{ secrets.RENDER_KEY }}
        run: bash unpack.sh payload work

      - name: Pick a Chrome
        run: |
          if [ -n "$(command -v google-chrome)" ]; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            curl -sL -o /tmp/chrome.zip https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.38/linux64/chrome-linux64.zip
            unzip -q /tmp/chrome.zip -d /tmp/chrome
            echo "CHROME_PATH=/tmp/chrome/chrome-linux64/chrome" >> "$GITHUB_ENV"
          fi
          echo "Using CHROME_PATH=$CHROME_PATH"

      - name: Fetch original photos from Commons (spaced, Chrome UA)
        working-directory: work
        run: python3 payload/${{ inputs.slug }}/fetch_assets.py

      - name: Copy plates + base stickers
        working-directory: work
        run: python3 payload/${{ inputs.slug }}/make_plates.py

      - name: Draw new stickers
        working-directory: work
        run: python3 payload/${{ inputs.slug }}/make_stickers.py

      - name: Build the mix (narration + SFX, -14 LUFS / TP -1)
        working-directory: work
        run: python3 payload/${{ inputs.slug }}/mix_sfx.py

      - name: Install project deps
        working-directory: work
        run: npm ci --no-audit --no-fund

      - name: Render dense stills (1/sec + every pop instant)
        if: inputs.mode == 'stills'
        working-directory: work
        run: node ${{ inputs.stills }}

      - name: Upload stills + mix (ONE artifact)
        if: inputs.mode == 'stills'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.slug }}-stills
          path: |
            work/stills-${{ inputs.slug }}/
            work/public/*/*-mix.wav
          retention-days: 14
          if-no-files-found: warn

      - name: Render range (PNG rolling encode, Spain method)
        if: inputs.mode != 'stills'
        working-directory: work
        run: bash ci_range.sh "${{ inputs.slug }}-${{ inputs.mode }}" "$GITHUB_WORKSPACE/work/src/index${{ inputs.comp }}.tsx" ${{ inputs.comp }} ${{ inputs.start }} ${{ inputs.end }}

      - name: Upload segments
        if: inputs.mode != 'stills'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.slug }}-${{ inputs.mode }}-segments
          path: |
            work/segs/
            work/finish-${{ inputs.slug }}-${{ inputs.mode }}.log
            work/public/*/*-mix.wav
          retention-days: 14
          if-no-files-found: warn
